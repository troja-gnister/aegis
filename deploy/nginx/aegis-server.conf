root /usr/share/nginx/html;

add_header_inherit merge;
add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header X-Request-ID $aegis_request_id always;
proxy_hide_header X-Request-ID;
proxy_hide_header Referrer-Policy;
# The gateway owns these; web's own copies would otherwise duplicate them.
proxy_hide_header X-Frame-Options;
proxy_hide_header X-Content-Type-Options;

location = /admin/login/ {
    proxy_ignore_headers X-Accel-Redirect;
    limit_req zone=admin_login burst=10 nodelay;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

location = /admin {
    proxy_ignore_headers X-Accel-Redirect;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

location /admin/ {
    proxy_ignore_headers X-Accel-Redirect;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

location ^~ /admin-static/admin/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=3600" always;
}

location /admin-static/ {
    return 404;
}

location = /api/v1/auth/login {
    proxy_ignore_headers X-Accel-Redirect;
    limit_req zone=login burst=10 nodelay;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

# Interactive media requests queue worker jobs; web bounds them per user, and this
# bounds them per client address as a second layer.
location ~ ^/api/v1/entries/[^/]+/media/requests$ {
    limit_req zone=media_requests burst=30 nodelay;
    # 429 tells the client to slow down; the login zones keep nginx's default status.
    limit_req_status 429;
    add_header Retry-After $aegis_media_retry_after always;
    proxy_ignore_headers X-Accel-Redirect;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

location /api/ {
    proxy_ignore_headers X-Accel-Redirect;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

# Media delivery: proxied like /api/, but Django sets the caching of every response
# (derivatives are revalidated with their ETag; originals are never stored). A larger
# header buffer holds an X-Accel-Redirect to a deep, percent-encoded original path.
location /media/ {
    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

location /health/ {
    proxy_ignore_headers X-Accel-Redirect;
    add_header Cache-Control "private, no-store" always;
    proxy_set_header Host $http_host;
    proxy_set_header X-Request-ID $aegis_request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $aegis_forwarded_proto;
    proxy_set_header X-Aegis-Proxy-Attestation "";
    proxy_pass http://web:8000;
}

location ~* "/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:css|js|map|png|jpe?g|gif|svg|webp|woff2?)$" {
    try_files $uri =404;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

location = /index.html {
    add_header Cache-Control "private, no-store" always;
    try_files $uri =404;
}

location / {
    add_header Cache-Control "private, no-store" always;
    try_files $uri $uri/ /index.html;
}

# Internal redirect targets of /media/ (X-Accel-Redirect from web). nginx keeps only
# Content-Type, Content-Disposition, Cache-Control, Expires, Accept-Ranges and Set-Cookie
# from the upstream answer; it never derives a type from the file name here, so a file
# without an upstream type is served as an opaque download. "^~" keeps regular-expression
# locations (such as the hashed-asset one) from claiming a redirected original's path.
location ^~ /__aegis_roots/ {
    internal;
    alias /srv/aegis/roots/;
    disable_symlinks on;
    # The static handler answers a directory with a 301 whose Location names this
    # internal path; a directory is never an original.
    if (-d $request_filename) {
        return 404;
    }
    sendfile on;
    max_ranges 1;
    types { }
    default_type application/octet-stream;
}

# Derivatives keep web's strong ETag (the derivative key) and Vary instead of the static
# ETag, and are never answered 304 by date: web answers conditional requests itself.
location ^~ /__aegis_derivatives/ {
    internal;
    alias /srv/aegis/derivatives/;
    disable_symlinks on;
    if (-d $request_filename) {
        return 404;
    }
    sendfile on;
    max_ranges 1;
    types { }
    default_type application/octet-stream;
    etag off;
    if_modified_since off;
    add_header ETag $upstream_http_etag;
    add_header Vary $upstream_http_vary;
}
