worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr crit;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format aegis_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","logger":"nginx.access","message":"HTTP request completed","request_id":"$aegis_request_id","status":$status}';
    access_log /dev/stdout aegis_json;
    server_tokens off;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_request_id $aegis_request_id {
        "~^[A-Za-z0-9_-]{8,64}$" $http_x_request_id;
        default $request_id;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

    server {
        listen 8080;
        root /usr/share/nginx/html;

        add_header_inherit merge;
        add_header Content-Security-Policy "default-src 'self'; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header X-Request-ID $aegis_request_id always;
        proxy_hide_header X-Request-ID;

        location = /admin/login/ {
            limit_req zone=admin_login burst=10 nodelay;
            add_header Cache-Control "private, no-store" always;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $aegis_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://web:8000;
        }

        location = /admin {
            add_header Cache-Control "private, no-store" always;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $aegis_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://web:8000;
        }

        location /admin/ {
            add_header Cache-Control "private, no-store" always;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $aegis_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://web:8000;
        }

        location ^~ /admin-static/admin/ {
            try_files $uri =404;
            add_header Cache-Control "public, max-age=3600" always;
        }

        location /admin-static/ {
            return 404;
        }

        location = /api/v1/auth/login {
            limit_req zone=login burst=10 nodelay;
            add_header Cache-Control "private, no-store" always;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $aegis_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://web:8000;
        }

        location /api/ {
            add_header Cache-Control "private, no-store" always;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $aegis_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://web:8000;
        }

        location /health/ {
            add_header Cache-Control "private, no-store" always;
            proxy_set_header Host $host;
            proxy_set_header X-Request-ID $aegis_request_id;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_pass http://web:8000;
        }

        location ~* "/assets/[^/]+-[A-Za-z0-9_-]{8,}\.(?:css|js|map|png|jpe?g|gif|svg|webp|woff2?)$" {
            try_files $uri =404;
            expires 1y;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
        }

        location = /index.html {
            add_header Cache-Control "private, no-store" always;
            try_files $uri =404;
        }

        location / {
            add_header Cache-Control "private, no-store" always;
            try_files $uri $uri/ /index.html;
        }

        location /__aegis_roots/ {
            internal;
            alias /srv/aegis/roots/;
            disable_symlinks on;
        }

        location /__aegis_derivatives/ {
            internal;
            alias /srv/aegis/derivatives/;
            disable_symlinks on;
        }
    }
}
