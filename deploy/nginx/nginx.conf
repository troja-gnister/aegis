worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/null emerg;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    log_format aegis_json escape=json '{"timestamp":"$time_iso8601","level":"INFO","logger":"nginx.access","message":"HTTP request completed","request_id":"$aegis_request_id","status":$status}';
    access_log /dev/stdout aegis_json;
    server_tokens off;

    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    map $http_x_request_id $aegis_request_id {
        "~^[A-Za-z0-9_-]{8,64}$" $http_x_request_id;
        default $request_id;
    }

    map $http_x_forwarded_for $aegis_reject_caddy_identity_shape {
        "" 1;
        "~[,[:space:]]" 1;
        "~^.{46,}$" 1;
        default 0;
    }

    limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=admin_login:10m rate=10r/m;

    server {
        listen 8080;
        set $aegis_forwarded_proto $scheme;
        include /etc/nginx/aegis-server.conf;
    }

    server {
        listen tls-gateway:8081;

        # This listener is bound only to the private tls-hop interface. Caddy is
        # the sole peer on that network and overwrites X-Forwarded-For.
        set_real_ip_from 0.0.0.0/0;
        set_real_ip_from ::/0;
        real_ip_header X-Forwarded-For;
        real_ip_recursive off;

        if ($aegis_reject_caddy_identity_shape) {
            return 400;
        }

        # A rejected native IP parse leaves the effective and peer addresses equal.
        if ($remote_addr = $realip_remote_addr) {
            return 400;
        }

        set $aegis_forwarded_proto https;
        include /etc/nginx/aegis-server.conf;
    }
}
